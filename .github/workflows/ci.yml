name: Server CI and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: netin-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: [self-hosted, linux, arm64, netin-production]
    environment: production
    concurrency:
      group: netin-server-production
      cancel-in-progress: false
    steps:
      - name: Deploy production server
        run: /srv/netin-server/scripts/deploy-production.sh
