name: Server CI and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: netin-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: netin_test
          POSTGRES_USER: netin
          POSTGRES_PASSWORD: netin
        options: >-
          --health-cmd "pg_isready -U netin -d netin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgresql://netin:netin@localhost:5432/netin_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: [self-hosted, linux, arm64, netin-production]
    environment: production
    concurrency:
      group: netin-server-production
      cancel-in-progress: false
    steps:
      - name: Deploy production server
        run: /srv/netin-server/scripts/deploy-production.sh
