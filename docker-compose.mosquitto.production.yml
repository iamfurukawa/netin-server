services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: netin-mosquitto
    restart: unless-stopped
    volumes:
      - ./infra/mosquitto/mosquitto.production.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - nginxnet

volumes:
  mosquitto-data:
  mosquitto-log:

networks:
  nginxnet:
    external: true
