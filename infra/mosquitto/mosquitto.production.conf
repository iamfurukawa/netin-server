persistence true
persistence_location /mosquitto/data/
log_dest stdout

allow_anonymous false
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Consumed only inside the Docker network by the Netin API worker.
listener 1883

# Reached externally only through Cloudflare Tunnel -> Nginx.
listener 9001
protocol websockets
